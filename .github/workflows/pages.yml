# Publishes the PokéDex web app (site/) to GitHub Pages together with a fresh
# copy of the day's card prices. Runs on every update and once a day.
name: Publikacja

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # daily, after TCGCSV's evening update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ceny dnia (kopia TCGCSV)
        run: node mirror-tcgcsv.mjs site/tcgcsv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
